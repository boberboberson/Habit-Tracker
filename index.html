<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meine Apps</title>
<style>
  :root {
    --bg: #0f1115;
    --card-bg: #1a1d24;
    --accent: #4f8cff;
    --text: #e8e9ec;
    --text-dim: #9a9ea8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    padding: 24px;
  }
  .wrap {
    width: 100%;
    max-width: 480px;
  }
  h1 {
    text-align: center;
    font-size: 1.6rem;
    font-weight: 600;
    margin-bottom: 8px;
  }
  p.sub {
    text-align: center;
    color: var(--text-dim);
    margin-bottom: 32px;
    font-size: 0.95rem;
  }
  .card {
    display: block;
    background: var(--card-bg);
    border: 1px solid #2a2e38;
    border-radius: 14px;
    padding: 20px 22px;
    margin-bottom: 16px;
    text-decoration: none;
    color: var(--text);
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .card:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
  }
  .card h2 {
    margin: 0 0 4px 0;
    font-size: 1.15rem;
  }
  .card p {
    margin: 0;
    color: var(--text-dim);
    font-size: 0.9rem;
  }
  .emoji {
    font-size: 1.4rem;
    margin-right: 8px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Meine Apps</h1>
    <p class="sub">Kleine Tools für den Alltag</p>

    <a class="card" href="mealplaner.html">
      <h2><span class="emoji">🍽️</span>Meal Planner</h2>
      <p>Essensplanung mit Supermarkt-Presets</p>
    </a>

    <a class="card" href="Habittracker.html">
      <h2><span class="emoji">📘</span>Werkheft</h2>
      <p>Habit-, Study- und Book-Tracker</p>
    </a>
  </div>
</body>
</html>
